[build-system]
requires = ["setuptools>=69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aureo-ml"
version = "0.1.0"
description = "Auriferous Exploration and Mineral Characterization with Machine Learning"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Diego F. Pulido Sastoque", email = "dfpulidos@unal.edu.co"}]
keywords = ["gold exploration", "geochemistry", "machine learning", "geoscience", "mining"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "catboost==1.2.7",
  "folium==0.17.0",
  "geopandas==1.0.1",
  "imbalanced-learn==0.12.4",
  "lightgbm==4.5.0",
  "matplotlib==3.9.2",
  "mlflow==2.16.2",
  "numpy==1.26.4",
  "optuna==4.0.0",
  "pandas==2.2.3",
  "plotly==5.24.1",
  "pydantic==2.9.2",
  "rasterio==1.3.11",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "shap==0.46.0",
  "shapely==2.0.6",
  "streamlit==1.39.0",
  "streamlit-folium==0.23.1",
  "xgboost==2.1.1",
]

[project.optional-dependencies]
dev = [
  "black==24.8.0",
  "coverage==7.6.1",
  "mypy==1.11.2",
  "nbformat==5.10.4",
  "pre-commit==3.8.0",
  "pytest==8.3.3",
  "pytest-cov==5.0.0",
  "ruff==0.6.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "D"]
ignore = ["D100", "D104", "D105", "D107", "D202", "N803"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
packages = ["aureo_ml"]
ignore_missing_imports = true
strict = true
warn_unreachable = true
disable_error_code = ["type-arg", "no-any-return", "misc"]

[tool.pytest.ini_options]
addopts = "--cov=src/aureo_ml --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
